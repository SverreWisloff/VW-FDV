<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tester – Villa Wisløff</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f4ef;
        --surface: #fff;
        --text: #1f2421;
        --muted: #646b66;
        --border: #d9d5cb;
        --ok: #2f6b4f;
        --error: #a02a2a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151816;
          --surface: #1e2320;
          --text: #eceee9;
          --muted: #a3aaa4;
          --border: #36403a;
          --ok: #6fb894;
          --error: #f08a8a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main { max-width: 52rem; margin: 0 auto; }
      h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
      .summary { margin: 0 0 1.25rem; color: var(--muted); }
      .summary strong { color: var(--text); }
      .summary.fail strong { color: var(--error); }
      ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
      li { padding: 0.45rem 0.25rem; border-bottom: 1px solid var(--border); }
      li.group {
        margin-top: 1rem;
        border-bottom: 0;
        padding-left: 0;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.75rem;
      }
      .pass::before { content: "✓"; color: var(--ok); font-weight: 700; margin-right: 0.5rem; }
      .fail::before { content: "✕"; color: var(--error); font-weight: 700; margin-right: 0.5rem; }
      .fail { color: var(--error); }
      .fail small { display: block; color: var(--muted); margin-left: 1.25rem; }
      .reload {
        margin-top: 1.5rem;
        font: inherit;
        padding: 0.45rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tester</h1>
      <p id="summary" class="summary">Kjører …</p>
      <ul id="results"></ul>
      <button type="button" id="reload" class="reload">Kjør på nytt</button>
    </main>

    <script type="module">
      import { cases as dateCases } from "./tests/dates.test.js";
      import { cases as scheduleCases } from "./tests/schedule.test.js";
      import { cases as modelCases } from "./tests/model.test.js";

      const results = document.querySelector("#results");
      const summary = document.querySelector("#summary");

      function show(value) {
        if (typeof value === "string") return `«${value}»`;
        return JSON.stringify(value);
      }

      const assert = {
        equal(actual, expected) {
          if (!Object.is(actual, expected)) {
            throw new Error(`Forventet ${show(expected)}, fikk ${show(actual)}.`);
          }
        },
        true(value) {
          if (value !== true) throw new Error(`Forventet true, fikk ${show(value)}.`);
        },
        false(value) {
          if (value !== false) throw new Error(`Forventet false, fikk ${show(value)}.`);
        },
        deepEqual(actual, expected) {
          const a = JSON.stringify(actual);
          const e = JSON.stringify(expected);
          if (a !== e) throw new Error(`Forventet ${e}, fikk ${a}.`);
        },
        throws(fn, includes = "") {
          try {
            fn();
          } catch (error) {
            if (includes && !String(error?.message).includes(includes)) {
              throw new Error(`Feilen inneholdt ikke «${includes}»: ${error?.message}`);
            }
            return;
          }
          throw new Error("Forventet en feil, men ingen ble kastet.");
        },
      };

      const groups = [
        ["Datoer", dateCases],
        ["Plan og status", scheduleCases],
        ["Datamodell", modelCases],
      ];

      let passed = 0;
      let failed = 0;

      for (const [group, cases] of groups) {
        const heading = document.createElement("li");
        heading.className = "group";
        heading.textContent = group;
        results.append(heading);

        for (const testCase of cases) {
          const item = document.createElement("li");
          try {
            testCase.run(assert);
            item.className = "pass";
            item.textContent = testCase.name;
            passed += 1;
          } catch (error) {
            item.className = "fail";
            const title = document.createTextNode(testCase.name);
            const detail = document.createElement("small");
            detail.textContent = error?.message ?? String(error);
            item.append(title, detail);
            failed += 1;
            console.error(testCase.name, error);
          }
          results.append(item);
        }
      }

      const total = passed + failed;
      summary.classList.toggle("fail", failed > 0);
      summary.replaceChildren();
      const strong = document.createElement("strong");
      strong.textContent = failed === 0 ? "Alle tester er grønne." : `${failed} feilet.`;
      summary.append(strong, ` ${passed} av ${total} tester besto.`);
      document.title = `${failed === 0 ? "✓" : "✕"} ${passed}/${total} tester – Villa Wisløff`;

      document.querySelector("#reload").addEventListener("click", () => location.reload());
    </script>
  </body>
</html>
